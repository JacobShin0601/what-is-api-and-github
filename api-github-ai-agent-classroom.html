  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;audit-agent-deck&quot; class=&quot;aad&quot;&gt;
  &lt;style&gt;
    #audit-agent-deck {

    &lt;main class=&quot;aad-stage&quot;&gt;
      &lt;section class=&quot;aad-slide active&quot; data-phase=&quot;0&quot; data-note=&quot;첫 질문: ‘AI가 최신 숫자를 어디서 가져오는지 설명할 수 있나요?’ 손을 들어보게 합니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;Investment × Legal × Accounting&lt;/div&gt;
        &lt;h1&gt;API × MCP × GitHub × &lt;span class=&quot;aad-accent&quot;&gt;AI Agent&lt;/span&gt;&lt;/h1&gt;
        &lt;p class=&quot;aad-lede&quot;&gt;공식 데이터를 연결하고, 검증 가능한 기업분석 산출물을 만드는 60분 실습&lt;/p&gt;
        &lt;div class=&quot;aad-resource&quot;&gt;&lt;span class=&quot;aad-tag&quot;&gt;No-code mindset&lt;/span&gt;&lt;span class=&quot;aad-tag&quot;&gt;Source of truth&lt;/span&gt;&lt;span class=&quot;aad-tag&quot;&gt;Recent 10-K&lt;/span&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;0&quot; data-note=&quot;오늘의 성공 기준은 설치 완료가 아니라, 출처가 붙은 분석 결과를 한 번 만드는 것입니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;Today’s finish line&lt;/div&gt;&lt;h2&gt;한 시간 뒤, 직접 할 수 있는 것&lt;/h2&gt;
        &lt;div class=&quot;aad-grid3&quot;&gt;
          &lt;article class=&quot;aad-card&quot;&gt;&lt;div class=&quot;aad-number&quot;&gt;01&lt;/div&gt;&lt;strong&gt;연결&lt;/strong&gt;&lt;p&gt;API와 MCP의 역할을 구분하고 공식·구조화 데이터를 Agent에 연결합니다.&lt;/p&gt;&lt;/article&gt;
          &lt;article class=&quot;aad-card&quot;&gt;&lt;div class=&quot;aad-number&quot;&gt;02&lt;/div&gt;&lt;strong&gt;재사용&lt;/strong&gt;&lt;p&gt;GitHub 저장소를 clone하고 AI에게 사용법과 구조를 묻습니다.&lt;/p&gt;&lt;/article&gt;
          &lt;article class=&quot;aad-card&quot;&gt;&lt;div class=&quot;aad-number&quot;&gt;03&lt;/div&gt;&lt;strong&gt;검증&lt;/strong&gt;&lt;p&gt;최근 10-K를 투자·법무·회계 관점으로 분석하고 원문을 대조합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;0&quot; data-note=&quot;각 블록을 클릭하면 해당 구간으로 바로 이동합니다. 쉬는 시간 없는 압축형 구성입니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;Content flow&lt;/div&gt;&lt;h2&gt;설명 25분 · 실습 27분 · 검증 8분&lt;/h2&gt;
        &lt;div class=&quot;aad-flow&quot;&gt;
          &lt;button type=&quot;button&quot; data-jump=&quot;3&quot;&gt;&lt;b&gt;00–16&lt;/b&gt;&lt;span&gt;API · MCP · 주문&lt;/span&gt;&lt;small&gt;서비스·Agent·증권사 연결&lt;/small&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-jump=&quot;11&quot;&gt;&lt;b&gt;16–25&lt;/b&gt;&lt;span&gt;Search API&lt;/span&gt;&lt;small&gt;Tavily와 SerpAPI&lt;/small&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-jump=&quot;14&quot;&gt;&lt;b&gt;25–33&lt;/b&gt;&lt;span&gt;GitHub&lt;/span&gt;&lt;small&gt;clone으로 산출물 재사용&lt;/small&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-jump=&quot;17&quot;&gt;&lt;b&gt;33–49&lt;/b&gt;&lt;span&gt;Hybrid Lab&lt;/span&gt;&lt;small&gt;EDGAR · Tavily · FRED&lt;/small&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-jump=&quot;22&quot;&gt;&lt;b&gt;49–60&lt;/b&gt;&lt;span&gt;DD Gate&lt;/span&gt;&lt;small&gt;통합 근거와 사람의 검증&lt;/small&gt;&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;1&quot; data-note=&quot;API는 기술 용어가 아니라 ‘데이터를 주문하는 표준 창구’라고 설명합니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;API · 00–04&lt;/div&gt;&lt;h2&gt;API는 프로그램끼리 쓰는 &lt;span class=&quot;aad-cyan&quot;&gt;정해진 주문서&lt;/span&gt;&lt;/h2&gt;
        &lt;div class=&quot;aad-diagram&quot;&gt;
          &lt;div class=&quot;aad-node&quot;&gt;🙋&lt;b&gt;사용자 / Agent&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;aad-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;aad-node&quot;&gt;🧾&lt;b&gt;API 요청&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;aad-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;aad-node&quot;&gt;🏛️&lt;b&gt;공식 데이터&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;aad-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;aad-node&quot;&gt;📦&lt;b&gt;구조화 응답&lt;/b&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;aad-lede&quot;&gt;주방에 들어가는 대신 메뉴와 주문 형식에 맞춰 요청하고, 예측 가능한 형태로 결과를 받습니다.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;1&quot; data-note=&quot;S&amp;P Global·Bloomberg·SEC EDGAR나 Notion·Google Docs 자체가 API인 것은 아닙니다. API는 우리 프로그램이 그 데이터와 기능을 요청하고 결과를 받는 연결 규칙입니다. 실제 통신은 흔히 HTTPS를 사용합니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;API · 02–04&lt;/div&gt;&lt;h2&gt;외부 데이터와 서비스는 &lt;span class=&quot;aad-accent&quot;&gt;API라는 연결 규칙&lt;/span&gt;으로 만납니다&lt;/h2&gt;
        &lt;div class=&quot;aad-api-ecosystem&quot; aria-label=&quot;우리 코드와 외부 데이터·서비스를 API가 양방향으로 연결하는 도식&quot;&gt;
          &lt;article class=&quot;aad-api-side&quot;&gt;
            &lt;strong&gt;우리의 업무 도구&lt;/strong&gt;
            &lt;div class=&quot;aad-api-items&quot;&gt;&lt;div class=&quot;aad-api-item&quot;&gt;&lt;b&gt;Ask&lt;/b&gt;&lt;span&gt;Python · Excel · 사내 앱&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aad-api-item&quot;&gt;&lt;b&gt;Automate&lt;/b&gt;&lt;span&gt;Claude Code · Codex · Agent&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/article&gt;
          &lt;div class=&quot;aad-api-bridge&quot;&gt;
            &lt;div class=&quot;aad-api-message&quot;&gt;&lt;b&gt;REQUEST →&lt;/b&gt;데이터 조회 · 문서 생성 · 계산 실행&lt;/div&gt;
            &lt;div class=&quot;aad-api-core&quot;&gt;&lt;strong&gt;API&lt;/strong&gt;&lt;small&gt;주소 · 인증&lt;br&gt;요청 형식 · 응답 형식&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;aad-api-message&quot;&gt;&lt;b&gt;← RESPONSE&lt;/b&gt;JSON 데이터 · 처리 결과 · 상태&lt;/div&gt;
          &lt;/div&gt;
          &lt;article class=&quot;aad-api-side&quot;&gt;
            &lt;strong&gt;제3자의 데이터와 서비스&lt;/strong&gt;
            &lt;div class=&quot;aad-api-items&quot;&gt;&lt;div class=&quot;aad-api-item&quot;&gt;&lt;b&gt;Data&lt;/b&gt;&lt;span&gt;S&amp;amp;P Global · Bloomberg · SEC EDGAR&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aad-api-item&quot;&gt;&lt;b&gt;Service&lt;/b&gt;&lt;span&gt;Notion · Google Docs · 특수 알고리즘&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/article&gt;
        &lt;/div&gt;
        &lt;div class=&quot;aad-api-rule&quot;&gt;&lt;span class=&quot;aad-tag&quot;&gt;API ≠ 데이터 자체&lt;/span&gt;&lt;span class=&quot;aad-tag&quot;&gt;API ≠ 서비스 자체&lt;/span&gt;&lt;span class=&quot;aad-tag&quot;&gt;API = 서로 약속한 연결 창구&lt;/span&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;1&quot; data-note=&quot;실행 버튼을 누르고, 사람이 작성할 부분은 ‘원하는 결과’이며 코드와 형식은 Agent가 담당한다고 강조합니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;API · 04–06&lt;/div&gt;&lt;h2&gt;Request → Response를 눈으로 확인하기&lt;/h2&gt;
        &lt;div class=&quot;aad-demo&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;aad-code&quot;&gt;GET /submissions/CIK0000320193.json

User-Agent: workshop participant@email.com

원하는 것: Apple의 공시 목록&lt;/div&gt;&lt;button class=&quot;aad-run&quot; type=&quot;button&quot;&gt;요청 보내기 →&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;aad-code aad-response&quot;&gt;{
  &quot;status&quot;: &quot;ready&quot;,
  &quot;message&quot;: &quot;버튼을 눌러 응답 확인&quot;
}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;1&quot; data-note=&quot;‘API는 코드에, MCP는 Agent에 넣는다’는 좋은 기억법입니다. 단, MCP server가 기존 API를 감싸는 경우가 많아 둘은 경쟁 관계가 아니라고 정리합니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;API vs MCP · 06–09&lt;/div&gt;&lt;h2&gt;API는 서비스 연결, MCP는 &lt;span class=&quot;aad-accent&quot;&gt;Agent 연결&lt;/span&gt;&lt;/h2&gt;
        &lt;div class=&quot;aad-grid2&quot;&gt;
          &lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;API&lt;/strong&gt;&lt;p&gt;코드·앱이 서비스별 endpoint를 호출해 데이터나 기능을 받습니다.&lt;/p&gt;&lt;div class=&quot;aad-code&quot; style=&quot;min-height:auto;margin-top:14px&quot;&gt;Code / App → API → Service&lt;/div&gt;&lt;/article&gt;
          &lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;MCP&lt;/strong&gt;&lt;p&gt;AI 애플리케이션이 도구·자료를 발견하고 공통 방식으로 사용합니다.&lt;/p&gt;&lt;div class=&quot;aad-code&quot; style=&quot;min-height:auto;margin-top:14px&quot;&gt;AI Agent → MCP server → Tools&lt;/div&gt;&lt;/article&gt;
        &lt;/div&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;1&quot; data-note=&quot;왼쪽은 공식 order_cash 샘플의 핵심 입력을 교육용으로 단순화한 것입니다. 오른쪽 상태를 순서대로 읽으면서 거절, 미체결, 부분체결이 정상적으로 발생할 수 있음을 설명합니다. 고정 가격을 복사해 실행하지 않습니다.&quot;&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;2&quot; data-note=&quot;두 서비스 중 하나만 가입해도 실습 가능합니다. Tavily는 Agent 검색, SerpAPI는 검색결과 구조화에 초점을 둡니다.&quot;&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;2&quot; data-note=&quot;화면 공유 중 키가 노출되지 않게 주의합니다. 참가자에게 채팅이나 저장소에 키를 붙이지 말라고 강조합니다.&quot;&gt;

          &lt;article class=&quot;aad-card&quot;&gt;&lt;strong class=&quot;aad-accent&quot;&gt;Do&lt;/strong&gt;&lt;ul class=&quot;aad-list&quot;&gt;&lt;li&gt;환경변수로 저장&lt;/li&gt;&lt;li&gt;.env는 .gitignore에 추가&lt;/li&gt;&lt;li&gt;노출 시 즉시 폐기·재발급&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

          &lt;div class=&quot;aad-node&quot;&gt;💻&lt;b&gt;내 컴퓨터&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;aad-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;aad-node&quot;&gt;🤖&lt;b&gt;Claude / Codex&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;aad-arrow&quot;&gt;→&lt;/div&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;4&quot; data-note=&quot;긴 프롬프트 하나로 최종 보고서를 만들지 않습니다. SEC 추출, 최신 사건, 거시맥락을 분리해 모은 뒤 통합하고 사람이 gate를 통과시킵니다.&quot;&gt;

        &lt;p class=&quot;aad-lede&quot;&gt;핵심 추적선: &lt;span class=&quot;aad-cyan&quot;&gt;원 출처 → evidence role → claim_id → 최종 문장&lt;/span&gt;&lt;/p&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;4&quot; data-note=&quot;세 소스는 같은 답을 주는 도구가 아닙니다. EDGAR는 회사의 공식 주장과 숫자, Tavily는 공시 후 사건, FRED는 거시맥락을 담당합니다. 마지막 판단은 Human Gate에서 합니다.&quot;&gt;

          &lt;article class=&quot;aad-evidence-lane&quot;&gt;&lt;strong&gt;② Tavily&lt;/strong&gt;&lt;p&gt;공시 후 회사 IR·규제기관·보도 원문을 찾아 같은 방향과 반대 방향을 함께 봅니다.&lt;/p&gt;&lt;span class=&quot;aad-tag&quot;&gt;corroborate / contradict&lt;/span&gt;&lt;/article&gt;
          &lt;article class=&quot;aad-evidence-lane&quot;&gt;&lt;strong&gt;③ FRED · 선택&lt;/strong&gt;&lt;p&gt;금리·물가·고용의 당시 환경을 series ID·단위·관측일과 함께 가져옵니다.&lt;/p&gt;&lt;span class=&quot;aad-tag&quot;&gt;context only&lt;/span&gt;&lt;/article&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;4&quot; data-note=&quot;검색 결과를 받았다는 사실과 증거로 채택했다는 판단을 구분합니다. 특히 FRED는 context_only이며, 회사 성과와 함께 움직여도 기업별 인과관계를 증명하지 않습니다.&quot;&gt;
        &lt;div class=&quot;aad-kicker&quot;&gt;Evidence roles · 46–49&lt;/div&gt;&lt;h2&gt;모든 근거에 &lt;span class=&quot;aad-cyan&quot;&gt;역할과 한계&lt;/span&gt;를 붙입니다&lt;/h2&gt;

          &lt;article class=&quot;aad-role-card&quot;&gt;&lt;strong&gt;primary_verification&lt;/strong&gt;&lt;p&gt;SEC 원문·회사 원문·공식 통계로 사실을 직접 확인&lt;/p&gt;&lt;/article&gt;
          &lt;article class=&quot;aad-role-card&quot;&gt;&lt;strong&gt;corroboration&lt;/strong&gt;&lt;p&gt;다른 원문이 MD&amp;amp;A 주장과 같은 방향을 보강&lt;/p&gt;&lt;/article&gt;

          &lt;article class=&quot;aad-role-card&quot;&gt;&lt;strong&gt;unresolved&lt;/strong&gt;&lt;p&gt;원문·날짜·범위가 부족해 아직 채택할 수 없음&lt;/p&gt;&lt;/article&gt;
        &lt;/div&gt;

      &lt;section class=&quot;aad-slide&quot; data-phase=&quot;4&quot; data-note=&quot;탭을 순서대로 누르며 각 Agent turn의 지시와 정지 조건을 설명합니다. 참가자는 한 단계가 끝날 때마다 결과 파일을 열어보고 다음 프롬프트를 입력합니다.&quot;&gt;

        &lt;div class=&quot;aad-pane&quot; data-pane-id=&quot;dd1&quot;&gt;&lt;div class=&quot;aad-compare&quot;&gt;&lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;Agent 지시&lt;/strong&gt;&lt;p&gt;최신·직전 10-K의 form·기간·accession과 Item 7 경계를 저장하고 분석하지 마.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;Gate A&lt;/strong&gt;&lt;p&gt;사람이 법인·기간·원문 링크와 extraction check를 직접 확인합니다.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;aad-pane&quot; data-pane-id=&quot;dd2&quot;&gt;&lt;div class=&quot;aad-compare&quot;&gt;&lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;Agent 지시&lt;/strong&gt;&lt;p&gt;전년 변화와 검증 가능한 경영진 claim을 뽑고 재무 숫자의 기간·단위를 연결해.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;aad-card&quot;&gt;&lt;strong&gt;완료 기준&lt;/strong&gt;&lt;p&gt;management claim과 해석이 분리되고 모든 claim이 accession으로 돌아갑니다.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;aside class=&quot;aad-notes&quot; aria-live=&quot;polite&quot;&gt;&lt;b&gt;강사 메모&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/aside&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;audit-agent-deck&#x27;);
      const slides = [...root.querySelectorAll(&#x27;.aad-slide&#x27;)];
      const phases = [...root.querySelectorAll(&#x27;.aad-phase&#x27;)];
      const progress = root.querySelector(&#x27;.aad-timeline span&#x27;);
      const count = root.querySelector(&#x27;.aad-count&#x27;);
      const noteBox = root.querySelector(&#x27;.aad-notes&#x27;);
      const noteText = noteBox.querySelector(&#x27;span&#x27;);
      let index = 0;
      const phaseStart = [0,3,11,14,17,22];
      function show(next){
        index = Math.max(0,Math.min(slides.length-1,next));
        slides.forEach((s,i)=&gt;s.classList.toggle(&#x27;active&#x27;,i===index));
        const phase = Number(slides[index].dataset.phase);
        phases.forEach((p,i)=&gt;p.classList.toggle(&#x27;active&#x27;,i===phase));
        progress.style.width = (((index+1)/slides.length)*100)+&#x27;%&#x27;;
        count.textContent = String(index+1).padStart(2,&#x27;0&#x27;)+&#x27; / &#x27;+slides.length;
        noteText.textContent = slides[index].dataset.note || &#x27;&#x27;;
      }
      root.querySelector(&#x27;.aad-prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;show(index-1));
      root.querySelector(&#x27;.aad-next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;show(index+1));
      root.querySelectorAll(&#x27;[data-jump]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;show(Number(b.dataset.jump))));
      function toggleNotes(){const open=!noteBox.classList.contains(&#x27;show&#x27;);noteBox.classList.toggle(&#x27;show&#x27;,open);root.querySelector(&#x27;.aad-note-toggle&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(open));}
      root.querySelector(&#x27;.aad-note-toggle&#x27;).addEventListener(&#x27;click&#x27;,toggleNotes);
      root.querySelector(&#x27;.aad-full&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{if(!document.fullscreenElement){root.requestFullscreen?.();}else{document.exitFullscreen?.();}});
      root.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;||e.key===&#x27; &#x27;){e.preventDefault();show(index+1);}if(e.key===&#x27;ArrowLeft&#x27;){show(index-1);}if(e.key.toLowerCase()===&#x27;n&#x27;){toggleNotes();}if(e.key.toLowerCase()===&#x27;f&#x27;){root.querySelector(&#x27;.aad-full&#x27;).click();}});
      root.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(group=&gt;{group.querySelectorAll(&#x27;[data-pane]&#x27;).forEach(tab=&gt;tab.addEventListener(&#x27;click&#x27;,()=&gt;{const key=tab.dataset.pane;group.querySelectorAll(&#x27;[data-pane]&#x27;).forEach(t=&gt;t.classList.toggle(&#x27;active&#x27;,t===tab));const slide=group.closest(&#x27;.aad-slide&#x27;);slide.querySelectorAll(&#x27;.aad-pane&#x27;).forEach(p=&gt;p.classList.toggle(&#x27;active&#x27;,p.dataset.paneId===key));}));});
      root.querySelector(&#x27;.aad-run&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{e.currentTarget.textContent=&#x27;응답 수신 ✓&#x27;;root.querySelector(&#x27;.aad-response&#x27;).textContent=[&#x27;{&#x27;,&#x27;  &quot;company&quot;: &quot;Apple Inc.&quot;,&#x27;,&#x27;  &quot;form&quot;: &quot;10-K&quot;,&#x27;,&#x27;  &quot;filing_date&quot;: &quot;YYYY-MM-DD&quot;,&#x27;,&#x27;  &quot;accession&quot;: &quot;원문 추적용 식별자&quot;,&#x27;,&#x27;  &quot;source&quot;: &quot;SEC EDGAR&quot;&#x27;,&#x27;}&#x27;].join(&#x27;\n&#x27;);});
      root.querySelectorAll(&#x27;.aad-repo-filters .aad-tab&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{root.querySelectorAll(&#x27;.aad-repo-filters .aad-tab&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));root.querySelectorAll(&#x27;.aad-repo&#x27;).forEach(r=&gt;r.classList.toggle(&#x27;hide&#x27;,b.dataset.filter!==&#x27;all&#x27;&amp;&amp;r.dataset.cat!==b.dataset.filter));}));
      root.querySelectorAll(&#x27;.aad-check&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;b.classList.toggle(&#x27;done&#x27;)));
      let start=Date.now();setInterval(()=&gt;{const s=Math.floor((Date.now()-start)/1000);root.querySelector(&#x27;.aad-time&#x27;).textContent=String(Math.floor(s/60)).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(s%60).padStart(2,&#x27;0&#x27;);},1000);
      let touchX=0;root.addEventListener(&#x27;touchstart&#x27;,e=&gt;{touchX=e.changedTouches[0].clientX},{passive:true});root.addEventListener(&#x27;touchend&#x27;,e=&gt;{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)&gt;60)show(index+(dx&lt;0?1:-1));},{passive:true});
      show(0);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
